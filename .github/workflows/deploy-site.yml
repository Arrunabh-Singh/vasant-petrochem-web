name: Deploy site

# The public site on Cloudflare Workers. A merge to main deploys www; a pull
# request uploads a preview version (drafts shown, forms always dry runs) and
# comments its link. Until the repository secret CLOUDFLARE_API_TOKEN exists
# (Workers Scripts: Edit, Account Settings: Read), it deploys nothing.
on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "design-system/**", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["site/**", "content/**", "design-system/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  # Never stop a production deploy halfway; previews may be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Pull requests from forks never see the secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Waiting for Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing was deployed (docs/runbooks/cloudflare-cutover.md)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Deploy www
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        run: npm run build && npx wrangler deploy
      - name: Upload a preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        env:
          DRAFT_PREVIEW: "1"
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          npm run build
          npx wrangler versions upload --preview-alias "pr-$PR" 2>&1 | tee upload.log
          url=$(grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -n "$url" ]; then
            gh pr comment "$PR" --edit-last --body "Preview: $url (drafts shown; forms are dry runs)" \
              || gh pr comment "$PR" --body "Preview: $url (drafts shown; forms are dry runs)"
          fi
