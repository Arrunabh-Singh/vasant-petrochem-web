name: CodeQL

# Static analysis of the hub and the site (JavaScript and TypeScript), on
# every pull request and weekly against main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 3" # Wednesdays 08:11 IST

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
