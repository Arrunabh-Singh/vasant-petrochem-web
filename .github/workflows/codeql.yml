name: CodeQL

# Static analysis of the hub and the site (JavaScript and TypeScript), on
# every pull request and weekly against main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 3" # Wednesdays 08:11 IST

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
