name: Site

# The public site (site/), the content and design system it is built from,
# and the database functions it calls. The hub keeps its own workflow (ci.yml).
on:
  pull_request:
    paths: ["site/**", "content/**", "design-system/**", "supabase/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "content/**", "design-system/**", "supabase/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: site check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Types, unit tests, a production build, then scripts/checks.mjs on the
      # built pages (TODO markers, inline scripts and styles, foreign hosts,
      # broken links, JS budgets, the copyright year).
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      # content/_schemas is generated from src/content/schema.ts for editors and
      # agents; a schema change must ship with its regenerated JSON Schema.
      - name: JSON Schemas are current
        run: npm run content:schema && git diff --exit-code -- ../content/_schemas

  sql:
    name: database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # Each file in supabase/tests runs on its own scratch database and rolls
      # back; the Supabase roles the migrations grant to are cluster-wide.
      - name: Run the SQL tests
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
          for t in supabase/tests/*.sql; do
            db="t_$(basename "$t" .sql | tr -c 'a-z0-9\n' '_')"
            createdb "$db"
            psql -X -q -v ON_ERROR_STOP=1 -d "$db" -f "$t"
          done
