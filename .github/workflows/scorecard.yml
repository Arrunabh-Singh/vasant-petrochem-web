name: Scorecard

# OpenSSF Scorecard: supply-chain checks on the default branch, weekly and
# after each merge. Results go to the Security tab and the public Scorecard API.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1" # Mondays 08:11 IST
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: results.sarif
