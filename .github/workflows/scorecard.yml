name: Scorecard

# OpenSSF Scorecard: supply-chain checks on the default branch, weekly and
# after each merge. Results go to the Security tab and the public Scorecard API.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1" # Mondays 08:11 IST
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
