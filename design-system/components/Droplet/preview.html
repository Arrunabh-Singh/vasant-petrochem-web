<!-- @dsCard group="Product" height=420 subtitle="One drop per product, and the fill moment" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Droplet — preview</title>
<style>
  .dp-wrap { display: grid; gap: var(--space-6); grid-template-columns: minmax(0, 1fr) 220px; align-items: center; }
  .dp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5) var(--space-3); margin: 0; padding: 0; list-style: none; }
  .dp-grid li { display: grid; justify-items: center; gap: var(--space-2); text-align: center; }
  .dp-name { font: 600 13px/18px var(--font-sans); color: var(--ink); }
  .dp-tint { font: 500 12px/16px var(--font-mono); color: var(--secondary); }
  .dp-stage { display: grid; justify-items: center; gap: var(--space-4); padding: var(--space-6) var(--space-4); border-radius: var(--radius-lg); background: var(--parchment); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var V = window.Vasant, h = React.createElement;
  function App() {
    var st = React.useState(0), run = st[0], setRun = st[1];
    return h('div', { className: 'vp-demo dp-wrap' },
      h('ul', { className: 'dp-grid' }, V.catalog.map(function (p) {
        return h('li', { key: p.slug },
          h(V.Droplet, { slug: p.slug, size: 52 }),
          h('span', { className: 'dp-name' }, p.name),
          h('span', { className: 'dp-tint' }, V.tintFor(p.slug)));
      })),
      h('div', { className: 'dp-stage' },
        h(V.Droplet, { key: run, slug: 'base-oil-sn500', size: 120, animate: true, title: 'Base Oil SN500' }),
        h(V.Button, { variant: 'secondary', size: 'small', onClick: function () { setRun(run + 1); } }, 'Fill again')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
