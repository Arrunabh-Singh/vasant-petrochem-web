<!-- @dsCard group="Navigation" height=230 subtitle="Sticky product bar in glass" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LocalNav — preview</title>
<style>.ln-under { padding: var(--space-4) var(--space-8); color: var(--secondary); font-size: 15px; } .ln-phone { max-width: 390px; margin-top: var(--space-5); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var V = window.Vasant, h = React.createElement;
  function App() {
    return h('div', { className: 'vp-demo' },
      h(V.Frame, { width: 1280, label: 'Laptop · 1280px' }, h(V.LocalNav, { product: V.product('base-oil-sn500'), active: 'Specs' })),
      h('div', { className: 'ln-phone' },
        h(V.Frame, { width: 390, label: 'Phone · 390px' }, h(V.LocalNav, { product: V.product('mineral-turpentine-oil') }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
