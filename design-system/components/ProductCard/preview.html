<!-- @dsCard group="Product" height=640 subtitle="Phone stack and laptop grid" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProductCard — preview</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Vasant, h = React.createElement;
  function pad(children) { return h('div', { style: { padding: '24px 0' } }, h('div', { className: 'vp-container' }, children)); }
  function App() {
    var cards = function (n) { return V.catalog.slice(0, n).map(function (p) { return h(V.ProductCard, { key: p.slug, product: p }); }); };
    return h('div', { className: 'vp-demo vp-demo-pair' },
      h(V.Frame, { width: 390, label: 'Phone · 390px' }, pad(h('div', { className: 'vp-grid' }, cards(2)))),
      h(V.Frame, { width: 1280, label: 'Laptop · 1280px' }, pad(h('div', { className: 'vp-grid' }, cards(3)))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
