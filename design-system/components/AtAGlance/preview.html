<!-- @dsCard group="Product" height=300 subtitle="Phone rows, laptop columns" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AtAGlance — preview</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Vasant, h = React.createElement;
  function pad(children) { return h('div', { style: { padding: '4px 0 24px' } }, h('div', { className: 'vp-container' }, children)); }
  function App() {
    var p = V.product('base-oil-sn500');
    return h('div', { className: 'vp-demo vp-demo-pair' },
      h(V.Frame, { width: 390, label: 'Phone · 390px' }, pad(h(V.AtAGlance, { specs: p.specs }))),
      h(V.Frame, { width: 1280, label: 'Laptop · 1280px' }, pad(h(V.AtAGlance, { specs: p.specs }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
